name: Release

# Versioned releases: push a tag like v0.1.0 (or run this workflow manually
# with a version input — it creates the tag) and this attaches everything a
# user needs — the Claude skill zip, both add-in manifests, and the feature
# showcase deck — with auto-generated notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to create and release, e.g. v0.1.0"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # FULL HISTORY, for the same reason `ci.yml` needs it, and this file did
      # not get the fix when that one did.
      #
      # `backlog-health-table.test.ts` re-derives §0's table only for builds
      # that contain the two-master fix, and it asks git which those are:
      # `git log 6dfaa4b..HEAD`. A default checkout is shallow, that commit is
      # not in the clone, and the command fails with "ambiguous argument
      # '6dfaa4b..HEAD'". `ci.yml` carries `fetch-depth: 0` and a comment about
      # the 26 hours the same failure cost there.
      #
      # The v0.6.0 release attempt of 2026-09-12 died here, on `npm test`,
      # against a commit whose CI was green minutes earlier — because CI clones
      # deep and this did not. One fix, two call sites, and only one of them got
      # it: the defect this repo names more often than any other.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run skill
      - run: npm run showcase
      # Regenerate the production manifests (custom-domain URLs) fresh for the release.
      - run: npm run build:manifest
      # Pinned to a full commit SHA (current target of the v2 tag) — see ci.yml.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          files: |
            skill-dist/ssf-charts.zip
            manifest-prod.xml
            manifest-excel-prod.xml
            examples/showcase.pptx
