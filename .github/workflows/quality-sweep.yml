name: quality sweep

# Two checks that are too slow or too noisy to gate a PR, and too valuable to
# never run. Same slot as the office-js sweep, same rule: report only what a
# human would act on.
#
# Neither is a required check, deliberately. A mutation run takes minutes and a
# flake hunt runs the suite several times — put either in front of every merge
# and the first bad week gets it switched off.
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # Does the suite pass for the same reasons every time?
  #
  # A real one was found by hand this year: a 40ms budget racing a round trip,
  # green on an idle machine and red under load, misdiagnosed first as a stale
  # build artifact. Nothing in CI would ever have caught it — a flaky test that
  # passes on the run you are looking at is indistinguishable from a good one.
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:lib
      # Under load on purpose. An idle runner reproduces almost nothing: the
      # bug this exists for only appears when a timer competes with real work,
      # which is the condition a person's laptop is always in and a quiet CI box
      # never is.
      - name: Run the suite three times under load
        run: |
          for i in 1 2 3 4; do yes > /dev/null & done
          fail=0
          for run in 1 2 3; do
            echo "::group::run $run"
            # BOTH reporters, and that is the whole point of this line. With
            # `--reporter=json` alone every failure goes into the outputFile and
            # NOTHING reaches the console — so a red run printed "run N: RED"
            # and not one word about which test, while the json was left in /tmp
            # on a runner that is then destroyed. This job was red on 2026-08-31
            # and 2026-09-07 and neither log names a single failing test; the
            # diagnosis had to be reproduced by hand on a 4-core box six days
            # later. A watchdog that cannot say what it saw is not a watchdog.
            #
            # `--outputFile.json=` (not `--outputFile=`) is required once there
            # is more than one reporter: the bare form has no reporter to bind
            # to and the json lands nowhere.
            if npx vitest run --reporter=default --reporter=json --outputFile.json="/tmp/run-$run.json"; then
              echo "run $run: green"
            else
              echo "run $run: RED"
              fail=1
            fi
            echo "::endgroup::"
          done
          kill %1 %2 %3 %4 2>/dev/null || true
          # `set +e` around the capture, exactly as office-js-watch.yml does it.
          #
          # Without it the step's default shell — Actions runs `bash -e {0}` —
          # exits the instant flaky.mjs returns 3, and 3 IS THE FINDING. `code`
          # was never read, `found=yes` was never written, the "File or update
          # the flake report" step was skipped by its own `if`, and the one case
          # this whole job exists for surfaced as an unexplained red step. The
          # sibling sweep has had the guard since it was written; this one never
          # did.
          set +e
          node scripts/flaky.mjs /tmp/run-1.json /tmp/run-2.json /tmp/run-3.json > /tmp/flaky.md
          code=$?
          set -e
          cat /tmp/flaky.md
          # 3 means "a test disagreed with itself", which is the finding. A plain
          # red suite across ALL runs is a broken build, not a flake, and must
          # not be filed as one.
          if [ "$code" = "3" ]; then echo "found=yes" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then exit "$code"; fi
          if [ "$fail" = "1" ] && [ "$code" = "0" ]; then
            echo "every run was red in the same way — that is a broken build, not a flake" >&2
            # Name them. `flaky.mjs` is silent here by design — it reports
            # DISAGREEMENT, and three identical reds disagree about nothing — so
            # without this the job's last word is a verdict with no evidence.
            node scripts/red-in-every-run.mjs /tmp/run-1.json /tmp/run-2.json /tmp/run-3.json || true
            exit 1
          fi
        id: hunt
      # The json survives the runner either way. A red that is a TIMEOUT under
      # saturation and a red that is a real assertion failure need different
      # answers, and the console summary above gives the first line only.
      - name: Keep the run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-run-reports
          path: /tmp/run-*.json
          if-no-files-found: ignore
      - name: File or update the flake report
        if: steps.hunt.outputs.found == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="flake watch: tests that disagree with themselves"
          existing=$(gh issue list --state all --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/flaky.md
            gh issue reopen "$existing" || true
          else
            gh issue create --title "$title" --body-file /tmp/flaky.md
          fi

  # Does the install path in the README still work?
  #
  # Every other gate in this repo reads the working tree. A user downloads the
  # asset attached to the latest RELEASE, and those two have diverged twice:
  # v0.1.0 shipped the dev manifests while the README pointed at a
  # `manifest-prod.xml` that was not in the release at all, and v0.3.0 shipped
  # `<Version>0.1.0</Version>` — the version Microsoft's own validator rejects,
  # fixed in the repo on 2026-08-06 by #289 and, with no release cut since,
  # never delivered to anyone.
  #
  # Weekly rather than per-PR because a PR cannot break it and cannot fix it:
  # what goes stale is the gap between main and the last release, and that grows
  # on its own with nobody touching anything.
  published-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check what a user actually downloads
        id: install
        run: |
          # `set +e` around the capture — see the flake job above. Under the
          # default `bash -e` the step dies on exit 3, which is the FINDING.
          set +e
          node scripts/check-published-install.mjs > /tmp/install.md
          code=$?
          set -e
          cat /tmp/install.md
          # 3 is "the published path is broken or stale"; 0 is sound; 2 means the
          # check could not reach GitHub, which must not read as a clean bill.
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then
            echo "the check itself could not run (exit $code)" >&2
            exit "$code"
          fi
          if [ "$code" = "3" ]; then echo "found=yes" >> "$GITHUB_OUTPUT"; fi
      - name: File or update the install-path report
        if: steps.install.outputs.found == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="install watch: the published manifest is broken or stale"
          existing=$(gh issue list --state all --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/install.md
            gh issue reopen "$existing" || true
          else
            gh issue create --title "$title" --body-file /tmp/install.md
          fi

  # Which assertions are decorative?
  #
  # "A regression test must be proven to fail without its fix" is this repo's
  # flagship rule and is enforced entirely by whoever remembers to stash the
  # source file. In one session alone, three guards turned out to pass against
  # the code they were written to catch — each found only because somebody did
  # the check by hand. Nobody has ever done it for the other two thousand.
  #
  # Scoped to `src/core`: the pure engine is the product, its tests are fast and
  # deterministic, and a mutation run over the Office.js renderer would mostly
  # measure the fake.
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A devDependency rather than `npx --package`: Stryker resolves
      # `typescript` from the project it is mutating, and an npx-isolated copy
      # cannot see it — the first attempt failed exactly there.
      - run: npx stryker run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
