name: quality sweep

# Two checks that are too slow or too noisy to gate a PR, and too valuable to
# never run. Same slot as the office-js sweep, same rule: report only what a
# human would act on.
#
# Neither is a required check, deliberately. A mutation run takes minutes and a
# flake hunt runs the suite several times — put either in front of every merge
# and the first bad week gets it switched off.
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # Does the suite pass for the same reasons every time?
  #
  # A real one was found by hand this year: a 40ms budget racing a round trip,
  # green on an idle machine and red under load, misdiagnosed first as a stale
  # build artifact. Nothing in CI would ever have caught it — a flaky test that
  # passes on the run you are looking at is indistinguishable from a good one.
  flake:
    runs-on: ubuntu-latest
    steps:
      # FULL HISTORY — THE THIRD CALL SITE OF ONE FIX, and the reason this job
      # was red on 2026-08-31 and 2026-09-07.
      #
      # `backlog-health-table.test.ts` asks git which builds contain the
      # two-master fix (`git log 6dfaa4b..HEAD`). A default checkout is shallow,
      # that commit is not in the clone, and the test fails deterministically
      # with "ambiguous argument '6dfaa4b..HEAD'". `ci.yml` has carried
      # `fetch-depth: 0` for this all along; `release.yml` got it on 2026-09-12
      # after the v0.6.0 release died on exactly this; this file never did.
      #
      # WORTH KNOWING HOW LONG IT HID. The job reported "every run was red in
      # the same way" and nothing else, because it ran vitest with json output
      # only — so two Mondays went by naming no test. It was named the first
      # time the job ran after the reporter was fixed. A shallow-clone failure
      # is also invisible to every local reproduction, because a working clone
      # has the history: chasing this on a laptop finds a different failure and
      # invites you to believe it is the same one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:lib
      # Under load on purpose. An idle runner reproduces almost nothing: the
      # bug this exists for only appears when a timer competes with real work,
      # which is the condition a person's laptop is always in and a quiet CI box
      # never is.
      - name: Run the suite three times under load
        run: |
          for i in 1 2 3 4; do yes > /dev/null & done
          fail=0
          reds=0
          for run in 1 2 3; do
            echo "::group::run $run"
            # BOTH reporters, and that is the whole point of this line. With
            # `--reporter=json` alone every failure goes into the outputFile and
            # NOTHING reaches the console — so a red run printed "run N: RED"
            # and not one word about which test, while the json was left in /tmp
            # on a runner that is then destroyed. This job was red on 2026-08-31
            # and 2026-09-07 and neither log names a single failing test; the
            # diagnosis had to be reproduced by hand on a 4-core box six days
            # later. A watchdog that cannot say what it saw is not a watchdog.
            #
            # `--outputFile.json=` names the reporter the path belongs to. A
            # bare `--outputFile=` ALSO works here — measured on vitest 4.1.11
            # with these exact two reporters, the file is written either way, so
            # `ci.yml`'s bare spelling is not a latent bug. An earlier version of
            # this comment asserted the bare form "lands nowhere"; that was
            # assumed from the docs and is wrong. The dotted form is kept only
            # because it says out loud which reporter is being aimed at, which
            # matters more the moment a third reporter appears.
            if npx vitest run --reporter=default --reporter=json --outputFile.json="/tmp/run-$run.json"; then
              echo "run $run: green"
            else
              echo "run $run: RED"
              fail=1
              reds=$((reds + 1))
            fi
            echo "::endgroup::"
          done
          kill %1 %2 %3 %4 2>/dev/null || true
          # `set +e` around the capture, exactly as office-js-watch.yml does it.
          #
          # Without it the step's default shell — Actions runs `bash -e {0}` —
          # exits the instant flaky.mjs returns 3, and 3 IS THE FINDING. `code`
          # was never read, `found=yes` was never written, the "File or update
          # the flake report" step was skipped by its own `if`, and the one case
          # this whole job exists for surfaced as an unexplained red step. The
          # sibling sweep has had the guard since it was written; this one never
          # did.
          set +e
          node scripts/flaky.mjs /tmp/run-1.json /tmp/run-2.json /tmp/run-3.json > /tmp/flaky.md
          code=$?
          set -e
          cat /tmp/flaky.md
          # 3 means "a test disagreed with itself", which is the finding. A plain
          # red suite across ALL runs is a broken build, not a flake, and must
          # not be filed as one.
          if [ "$code" = "3" ]; then echo "found=yes" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then exit "$code"; fi
          # THE VERDICT HAS TO SAY WHICH OF TWO THINGS IT SAW, and until
          # 2026-09-13 it said the wrong one out loud. The old branch fired on
          # "any run was red AND no test disagreed" and announced "every run was
          # red in the same way". Those are not the same claim: on 2026-09-13
          # exactly ONE of three runs was red, the other two green, and the job
          # still printed that sentence. Anyone reading the log was told the
          # build was broken when what had actually happened was a flake.
          #
          # The cause is that vitest can exit NON-ZERO with every test passing —
          # an unhandled error outside a test does it. `flaky.mjs` compares
          # test RESULTS, so it correctly finds no disagreement, and the
          # run-level failure falls into a branch built for a different shape.
          # That is precisely what hid a real one: a leaked 80 ms timer in
          # `pane-state.test.ts` firing after jsdom was torn down.
          if [ "$fail" = "1" ] && [ "$code" = "0" ]; then
            if [ "$reds" -ge 3 ]; then
              echo "all $reds runs were red and no test disagreed — a broken build, not a flake" >&2
            else
              echo "$reds of 3 runs were red while every TEST passed in all of them." >&2
              echo "That is a flake at the RUN level, not a broken build: vitest exits non-zero" >&2
              echo "on an unhandled error outside a test. Look for 'Unhandled Errors' in the" >&2
              echo "run logs above — a timer or promise outliving the file that scheduled it." >&2
            fi
            # Name any test that was red in every run. `flaky.mjs` is silent
            # there by design — it reports DISAGREEMENT, and identical reds
            # disagree about nothing — so without this the job's last word is a
            # verdict with no evidence. It prints "no per-test detail" when the
            # failure was not a test at all, which is itself the clue.
            node scripts/red-in-every-run.mjs /tmp/run-1.json /tmp/run-2.json /tmp/run-3.json || true
            exit 1
          fi
        id: hunt
      # The json survives the runner either way. A red that is a TIMEOUT under
      # saturation and a red that is a real assertion failure need different
      # answers, and the console summary above gives the first line only.
      - name: Keep the run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-run-reports
          path: /tmp/run-*.json
          if-no-files-found: ignore
      - name: File or update the flake report
        if: steps.hunt.outputs.found == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="flake watch: tests that disagree with themselves"
          existing=$(gh issue list --state all --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/flaky.md
            gh issue reopen "$existing" || true
          else
            gh issue create --title "$title" --body-file /tmp/flaky.md
          fi

  # Does the install path in the README still work?
  #
  # Every other gate in this repo reads the working tree. A user downloads the
  # asset attached to the latest RELEASE, and those two have diverged twice:
  # v0.1.0 shipped the dev manifests while the README pointed at a
  # `manifest-prod.xml` that was not in the release at all, and v0.3.0 shipped
  # `<Version>0.1.0</Version>` — the version Microsoft's own validator rejects,
  # fixed in the repo on 2026-08-06 by #289 and, with no release cut since,
  # never delivered to anyone.
  #
  # Weekly rather than per-PR because a PR cannot break it and cannot fix it:
  # what goes stale is the gap between main and the last release, and that grows
  # on its own with nobody touching anything.
  published-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check what a user actually downloads
        id: install
        run: |
          # `set +e` around the capture — see the flake job above. Under the
          # default `bash -e` the step dies on exit 3, which is the FINDING.
          set +e
          node scripts/check-published-install.mjs > /tmp/install.md
          code=$?
          set -e
          cat /tmp/install.md
          # 3 is "the published path is broken or stale"; 0 is sound; 2 means the
          # check could not reach GitHub, which must not read as a clean bill.
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then
            echo "the check itself could not run (exit $code)" >&2
            exit "$code"
          fi
          if [ "$code" = "3" ]; then echo "found=yes" >> "$GITHUB_OUTPUT"; fi
      - name: File or update the install-path report
        if: steps.install.outputs.found == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="install watch: the published manifest is broken or stale"
          existing=$(gh issue list --state all --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/install.md
            gh issue reopen "$existing" || true
          else
            gh issue create --title "$title" --body-file /tmp/install.md
          fi

  # Which assertions are decorative?
  #
  # "A regression test must be proven to fail without its fix" is this repo's
  # flagship rule and is enforced entirely by whoever remembers to stash the
  # source file. In one session alone, three guards turned out to pass against
  # the code they were written to catch — each found only because somebody did
  # the check by hand. Nobody has ever done it for the other two thousand.
  #
  # Scoped to `src/core`: the pure engine is the product, its tests are fast and
  # deterministic, and a mutation run over the Office.js renderer would mostly
  # measure the fake.
  mutation:
    runs-on: ubuntu-latest
    steps:
      # FULL HISTORY here too, defensively rather than on a diagnosis.
      #
      # `vitest.mutation.config.ts` does NOT exclude `backlog-health-table`, so
      # Stryker's initial dry run executes the same test that needs
      # `git log 6dfaa4b..HEAD` — and this checkout was shallow. On 2026-09-13
      # the dry run reported only a timeout and not that failure, which is
      # unexplained: either the sandbox still reached the real repo's git, or
      # the run stopped at the first failure it met. A deep clone costs seconds
      # and removes the question; leaving it costs a Monday to ask again.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # SCOPED TO THE WEEK'S DIFF, BECAUSE THE WHOLE-ENGINE RUN CANNOT FINISH.
      #
      # Measured rather than feared. GitHub's hard job ceiling is 6 hours and
      # this job has been killed at it FOUR times — 2026-08-10, 08-17, 08-24 and
      # 2026-09-14 at 6h00m29s — with zero reports produced in its whole life.
      # Monday's run left the arithmetic in its log:
      #
      #     elapsed: ~5h 49m, remaining: ~144h 26m
      #     3254/18724 tested (671 survived, 21 timed out)
      #
      # 559 mutants an hour, so ~33 hours for the set at that rate and Stryker's
      # own estimate said 144. Not a run that needs another timeout raised: it is
      # 5-25x over budget. (The four stacked timeouts fixed on 2026-09-13 got the
      # DRY RUN to complete in 12m07s. Necessary, nowhere near sufficient.)
      #
      # And 671 survivors in the 17% it reached extrapolates to ~3,900 for a full
      # run, which nobody reads — the same fate `office-js-watch.mjs` describes
      # for a report that says the same twenty things forever.
      #
      # So: mutate the lines that CHANGED. A quiet week mutates nothing and this
      # job exits after the dry run.
      - name: Scope the run to the week's diff
        id: scope
        run: |
          SCOPE="$(node scripts/mutation-scope.mjs --days 7)"
          if [ -z "$SCOPE" ]; then
            echo "no src/core changes in the last 7 days — nothing to mutate"
            echo "empty=yes" >> "$GITHUB_OUTPUT"
          else
            echo "mutating: $SCOPE"
            echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          fi
      # A devDependency rather than `npx --package`: Stryker resolves
      # `typescript` from the project it is mutating, and an npx-isolated copy
      # cannot see it — the first attempt failed exactly there.
      #
      # `tee` because the per-file score table is `clear-text`'s, and it goes to
      # STDOUT — which is not in `reports/` and so dies with the runner. It is
      # the one human-readable summary the run produces.
      - name: Run the mutants that changed
        if: steps.scope.outputs.empty != 'yes'
        run: |
          mkdir -p reports/mutation
          npx stryker run --mutate "${{ steps.scope.outputs.scope }}" | tee reports/mutation/clear-text.txt
      - name: Which survivors nobody has ruled on
        id: triage
        if: steps.scope.outputs.empty != 'yes'
        run: |
          # `set +e` around the capture, exactly as the two sibling jobs do it.
          # 3 IS THE FINDING here, and under the default `bash -e` the step would
          # die on it before `found` was ever written.
          set +e
          node scripts/mutation-triage.mjs reports/mutation/mutation.json > /tmp/mutants.md
          code=$?
          set -e
          cat /tmp/mutants.md
          if [ "$code" = "3" ]; then echo "found=yes" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then
            echo "the triage itself could not run (exit $code)" >&2
            exit "$code"
          fi
      # THE STEP THIS JOB ALONE LACKED. `flake` files one, `published-install`
      # files one, and mutation uploaded an artifact and stopped — which, with
      # `thresholds.break: null`, made it a green check with an attachment
      # nobody opens.
      - name: File or update the surviving-mutant report
        if: steps.triage.outputs.found == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="mutation watch: assertions that let a mutant live"
          existing=$(gh issue list --state all --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/mutants.md
            gh issue reopen "$existing" || true
          else
            gh issue create --title "$title" --body-file /tmp/mutants.md
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
