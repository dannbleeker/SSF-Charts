name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A hand crank, because the automatic triggers are not guaranteed to fire.
  #
  # On 2026-08-06 the `pull_request` event produced no CI run at all for PR
  # #300 — CodeQL ran on the same event, seconds later, and this workflow was
  # `active` and unmodified. Closing and reopening the PR did not fire it
  # either. `test` is the only required check, so a missed trigger is not a
  # nuisance: it blocks the merge with no way to ask for the check again, and
  # the only remaining lever is to push a commit nobody wanted in order to
  # provoke a `synchronize`.
  workflow_dispatch:

# Read-only by default; release-skill re-grants itself the contents: write it
# needs for the rolling release.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # FULL HISTORY, because a test in this suite reasons about ancestry.
      # `backlog-health-table.test.ts` re-derives §0's table only for builds that
      # contain the two-master fix, and it asks git which those are:
      # `git log 6dfaa4b..HEAD`. The default checkout is shallow (fetch-depth 1),
      # so that commit is not in the clone and the command fails with "ambiguous
      # argument '6dfaa4b..HEAD'". The test passed locally and could never pass
      # here, and CI stayed red for 26 hours and twenty commits before anyone
      # read the log.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # One run, two jobs: the coverage gate and the test-count high-water mark.
      # A second `vitest run` purely to count would double the slowest step in
      # CI, and a gate that expensive is one somebody eventually deletes.
      - run: npm run coverage -- --reporter=default --reporter=json --outputFile=/tmp/results.json
      # `CLAUDE.md` records a reorg that deleted 43 tests while the suite stayed
      # green, because nothing compared the count before against after. The rule
      # written down in response is enforced by memory; this enforces it.
      - name: The suite has not silently shrunk
        run: node scripts/test-count.mjs /tmp/results.json
      - run: npx vite build
      # The committed production manifests must match a fresh generation from
      # the dev manifests (same lockstep idea as the showcase deck).
      - name: Production manifests are current
        run: npm run build:manifest -- --check
      # Package the Claude Agent Skill from the same sources the tests just
      # validated, so the artifact can never drift from the feature set.
      - run: npm run skill
      - uses: actions/upload-artifact@v4
        with:
          name: ssf-charts-skill
          path: skill-dist/ssf-charts.zip
      # The committed showcase deck must match a fresh build — regenerate and
      # compare slide XMLs (deterministic; docProps timestamps excluded).
      - name: Showcase deck is current
        run: |
          cp examples/showcase.pptx /tmp/committed.pptx
          node scripts/build-showcase.mjs
          python3 - <<'EOF'
          import sys, zipfile
          a = zipfile.ZipFile('/tmp/committed.pptx')
          b = zipfile.ZipFile('examples/showcase.pptx')
          slides_a = sorted(n for n in a.namelist() if n.startswith('ppt/slides/slide'))
          slides_b = sorted(n for n in b.namelist() if n.startswith('ppt/slides/slide'))
          if slides_a != slides_b or any(a.read(n) != b.read(n) for n in slides_a):
              sys.exit("examples/showcase.pptx is stale — run `npm run showcase` and commit the result")
          print("showcase deck is current")
          EOF
      # Two file-level gates on the deck the step above just proved current.
      # They ask different questions and catch nearly disjoint sets: the first
      # is "did SSF Charts write what it meant to" (slot tags, groups, config
      # parts, duplicate shape ids); the second is "is this a legal .pptx at
      # all", against the OOXML grammar. Neither needs a PowerPoint.
      - name: The showcase deck is structurally sound
        run: npm run verify-deck examples/showcase.pptx
      - name: The showcase deck is schema-valid
        run: npm run validate-ooxml examples/showcase.pptx
      # Every sample chart, rasterised in a real browser, asked the one question
      # a text snapshot cannot answer: is anything VISIBLE. White-on-white, a
      # scale collapse to zero size, a translate off the canvas — each of those
      # produces a stable, diffable, entirely wrong SVG that the snapshot suite
      # passes. `CLAUDE.md` requires a human to look at renders before accepting
      # a snapshot update; this is the part of that a machine can do every time.
      - name: Install a browser for the visual gate
        run: npx playwright-core install --no-shell chromium
      - name: Every sample chart is visibly drawn
        run: node scripts/visible-charts.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: charts-that-are-not-visible
          path: visible-charts/
          if-no-files-found: ignore

  # Microsoft's own manifest validator, on the four manifests this repo ships.
  #
  # A JOB OF ITS OWN, and deliberately not part of `test`. The validator is a
  # call to a Microsoft SERVICE, not a local schema check, so its availability is
  # not ours — and `test` is the only check the branch ruleset requires, so a
  # service outage must not be able to block every merge in the repo. Here the
  # signal is visible and a red run is a thing to look at, not a wall.
  #
  # It is worth having because the manifest is the one artifact CI could not
  # otherwise judge: a broken one passes every test in this repo and fails when
  # the owner sideloads it, which is the slowest feedback loop the project has.
  # `CLAUDE.md` already flags manifest changes as the case that forces a
  # re-install; this is what says whether the file is worth re-installing.
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Both dev manifests and both production ones. The prod pair is generated
      # from the dev pair and committed, and `test` already gates them for
      # staleness — but "current" and "valid" are different questions, and only
      # the prod files are what anyone actually sideloads.
      - name: Manifests are valid
        run: |
          for m in manifest.xml manifest-excel.xml manifest-prod.xml manifest-excel-prod.xml; do
            echo "--- $m"
            npx --yes office-addin-manifest validate "$m"
          done

  # Every merge to main refreshes the rolling "skill-latest" release, giving
  # the newest skill zip a stable download URL.
  release-skill:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run skill
      # Pinned to a full commit SHA (the current target of the v2 tag): a mutable
      # tag on a third-party action can be repointed to hostile code, and this job
      # runs with contents:write + the release token. Bump deliberately.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: skill-latest
          name: SSF Charts Agent Skill (latest)
          body: >
            Rolling build of the Claude Agent Skill from the latest main.
            Upload the zip at claude.ai → Customize → Skills; it then also
            appears inside Claude for PowerPoint.
          prerelease: true
          files: skill-dist/ssf-charts.zip
