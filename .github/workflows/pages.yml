name: Deploy Pages

# Hosts the add-in + demo gallery on GitHub Pages (custom domain:
# ssf-chart.struktureretsundfornuft.dk). Office add-ins load their task pane
# and icons over HTTPS from here; the production manifests point at this origin.
# Separate from ci.yml so a docs/test change doesn't redeploy the site.
#
# IT USED TO DEPLOY WHETHER OR NOT THE TESTS PASSED, and it did so eighteen
# times. This ran on `push: branches: [main]` with no dependency on CI at all —
# its only `needs:` was its own `build` job — so a push with a red suite went
# straight to the site a user loads the add-in from. Measured 2026-09-11 over
# the last 100 CI runs on main: 18 were red, and Pages deployed successfully
# for 18 of 18. Not a theoretical gap.
#
# Now it waits for CI to finish and deploys only when CI SUCCEEDED.
#
# THE COST, measured rather than guessed: CI on main runs a median 259s (p90
# 270s) and the deploy itself a median 43s (p90 82s), so the site goes live
# about five minutes after a push instead of about one. Both deploy waits
# survive that with room — `scripts/await-deploy.mjs` allows 20 minutes by
# default, and `round.mjs`'s own wait is 40 polls x 20s = 13.3 minutes, which
# goes from roughly eight times the old latency to a little over twice the new
# one. Nothing needed retuning; if that changes, those are the two numbers.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    # Filters on the branch of the TRIGGERING run, so a `pull_request` CI run
    # from a feature branch does not deploy. Note that `workflow_run` only
    # fires for a workflow file that exists on the DEFAULT branch — this file
    # has to be on main to work at all, which it is.
    branches: [main]
  workflow_dispatch:

# NOTHING BY DEFAULT; each job asks for exactly what it uses.
#
# This was one workflow-wide grant of `contents: read` + `pages: write` +
# `id-token: write`, which handed BOTH jobs the token that can publish the
# site. `build` is the job that runs `npm ci`, and `npm ci` executes whatever
# lifecycle scripts the dependency tree ships — so the job with third-party
# code in it held the credential for the origin PowerPoint loads the add-in
# from, and had no use for it.
#
# Split per job instead. `actions/deploy-pages`'s own README gives its
# requirement as exactly two lines, `pages: write` and `id-token: write`, and
# NOT `contents: read`; `build` needs only the `contents: read` its checkout
# uses, because `actions/upload-pages-artifact` hands the artifact over on the
# runtime token rather than this one.
#
# With `permissions: {}` here, a job added later that forgets its own block
# gets nothing and fails loudly rather than inheriting the publish token.
permissions: {}

# One deploy at a time; don't cancel an in-flight publish.
#
# `cancel-in-progress` STAYS FALSE, and the CI gate is a reason to say so
# rather than to reconsider it: cancelling a Pages deployment is what cost this
# site an afternoon on 2026-08-06 — see the timeout comment at the bottom of
# this file, where the action's own timeout cancelled six consecutive deploys
# GitHub was still working on.
#
# WHAT THAT LEAVES OPEN, now that a deploy waits ~4.5 minutes for CI: push A
# then push B in quick succession and both CI runs pass, and nothing here
# guarantees A's deploy finishes before B's. The site can end up on A — an
# older commit, but a TESTED one. The window used to be about a minute and is
# now about five, so this got likelier rather than newly possible. It is also
# self-announcing: `round.mjs` refuses to run when HEAD and the deployed stamp
# disagree, which is exactly this state. Re-run this workflow by hand to
# settle it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # THE GATE. `workflow_run` fires on `completed` whatever the outcome —
    # failure, cancelled and timed_out all arrive here — so the conclusion has
    # to be tested explicitly or this change would do nothing at all.
    #
    # THE WHOLE WORKFLOW'S CONCLUSION, NOT JUST `test`'S, AND THAT WAS CHECKED
    # RATHER THAN ASSUMED. `ci.yml` has three jobs and one of them, `manifest`,
    # calls a Microsoft service — so the obvious worry is that an outage over
    # there stalls deployment here, and the obvious answer is a narrower gate
    # that asks the jobs API about `test` alone. Measured 2026-09-12 across the
    # last 60 CI runs on main: 18 were red, and every one of the twelve
    # inspected reads `test=failure manifest=success release-skill=skipped`.
    # `manifest` has never once been what made CI red.
    #
    # So the narrow gate would buy nothing and cost a second job, an
    # `actions: read` grant and an API call on the deploy path — three new ways
    # to fail, guarding against something that has not happened. Left alone
    # deliberately. If `manifest` ever does start failing on its own, that
    # measurement is the thing to re-run, not this comment to re-read.
    #
    # AND TWO CONDITIONS THAT ARE NOT ABOUT THE TESTS AT ALL. The first draft
    # of this file had only the conclusion check, and that combination — a
    # `workflow_run` trigger plus a checkout pinned to the triggering commit —
    # is the one GitHub's hardening guide names outright: "Workflows that use
    # these triggers must not explicitly check out untrusted code, including
    # from pull request forks."
    #
    # `ci.yml` runs on an unqualified `pull_request`, so it runs for FORK PRs,
    # so a fork PR finishing CI fires this event. `branches: [main]` does not
    # stop it: that filter matches `head_branch`, and a fork's default branch is
    # called `main` too. Without the clauses below, anyone could open a PR from
    # a fork, have this workflow check their commit out, run their lifecycle
    # scripts through `npm ci`, and publish the result to the live site
    # PowerPoint loads the add-in from.
    #
    # Two independent conditions, because one is a typo away from none: the
    # triggering run must belong to THIS repository, and it must have been a
    # push (or CI's own hand crank) rather than a `pull_request`.
    #
    # The `workflow_dispatch` clause comes first because a manual run of THIS
    # file carries no `workflow_run` payload, so every expression about it is
    # empty and the job would never run without it. `ci.yml` explains why this
    # repo keeps manual triggers — an automatic trigger silently failed to fire
    # once and there was no way to ask for the check again. That argument is
    # stronger here, not weaker: there are now TWO events in the chain that can
    # fail to fire.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    # The checkout's read, and nothing else. This job runs third-party lifecycle
    # scripts via `npm ci`; it must not be able to publish.
    permissions:
      contents: read
    steps:
      # THE COMMIT CI TESTED, NOT WHATEVER main POINTS AT NOW.
      #
      # This is the trap in `workflow_run` and it is silent. GitHub's own docs
      # say that for this event `GITHUB_SHA` is the "Last commit on default
      # branch" and `GITHUB_REF` is the "Default branch" — so an unpinned
      # `actions/checkout` builds main's HEAD, not the commit that passed. Push
      # B while CI for push A is still running and this would publish B, which
      # nothing has tested: a worse version of the defect this file was changed
      # to fix, and invisible, because the site would still serve something
      # plausible.
      #
      # `|| github.ref` is for the manual path, where there is no triggering
      # run and the dispatch ref is the right answer.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The publish credential lives HERE and only here. This job checks nothing
    # out and runs no dependency code — it hands GitHub an artifact `build`
    # already produced. `actions/deploy-pages` documents exactly these two and
    # does not ask for `contents: read`.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Half an hour, against the action's default of ten minutes.
          #
          # The default is what broke this site for a whole afternoon, and the
          # logs say so plainly. On 2026-08-06 six consecutive deployments of a
          # 250 KB artifact were accepted by GitHub, reported
          # `deployment_in_progress` on every one of ~120 status polls, and were
          # then KILLED by this action's own timeout:
          #
          #     Current status: deployment_in_progress   ×120, ten minutes
          #     ##[error]Timeout reached, aborting!
          #     Canceling Pages deployment...
          #
          # That last line is the part that matters. The action does not merely
          # stop waiting — it CANCELS the deployment GitHub was still working
          # on. So a Pages backend running slower than usual does not cost you a
          # slow deploy, it costs you every deploy, and re-running restarts the
          # same ten-minute race from zero. Five re-runs, five cancellations.
          #
          # Nothing here was at fault: `build` succeeded every time in about
          # seven seconds, and the artifact is a quarter of a megabyte. The only
          # dial this repo owns is how long it is willing to wait, and ten
          # minutes was a bet that Pages is always fast.
          timeout: 1800000
